<style>
:root {
  --bg: #eef0ec; --surface: #fbfbf8; --surface-2: #f3f3ee; --card: #ffffff;
  --border: #dcdfd6; --border-strong: #c3c8bc;
  --ink: #1d2621; --muted: #5b675f; --faint: #8b948c;
  --accent: #2f6b5a; --accent-ink: #fff; --accent-soft: #dbe9e2; --accent-soft-ink: #1f4a3d;
  --side: #17322b; --side-ink: #dfe9e4; --side-muted: #8fb0a4; --side-active: #24493f;
  --danger: #b3432e; --danger-bg: #f7e1db; --danger-ink: #7a2c1c;
  --warning: #b07a1e; --warning-bg: #f6ead2; --warning-ink: #6f4d12;
  --orange: #c4621d; --orange-bg: #f8e3d3; --orange-ink: #7a3a0e;
  --good: #3e8a5d; --good-bg: #dceee1; --good-ink: #235939;
  --info: #3a6c97; --info-bg: #dde7f0; --info-ink: #213f5c;
  --purple: #6b4fa0; --purple-bg: #e8e1f3; --purple-ink: #432f69;
  --slate: #6a7470; --slate-bg: #e7eae6; --slate-ink: #3a423e;
  --focus: #3a6c97;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 1px 1px rgba(20,30,25,.04);
  --shadow-pop: 0 14px 36px rgba(15,25,20,.2), 0 2px 8px rgba(15,25,20,.1);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, ui-sans-serif, sans-serif;
  --display: Georgia, "Iowan Old Style", "Palatino Linotype", ui-serif, serif;
  --mono: "SF Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1a201d; --surface-2: #212825; --card: #1f2622;
  --border: #313a35; --border-strong: #414b45;
  --ink: #e7ebe7; --muted: #a2ada5; --faint: #6f7a73;
  --accent: #6fb196; --accent-ink: #0d1612; --accent-soft: #233a31; --accent-soft-ink: #b8dccb;
  --side: #0d1a16; --side-ink: #d5e3dc; --side-muted: #7f9c91; --side-active: #1c3a31;
  --danger: #e2735d; --danger-bg: #3d211b; --danger-ink: #f4b9ab;
  --warning: #d9a74f; --warning-bg: #372c17; --warning-ink: #f1d398;
  --orange: #e48a4a; --orange-bg: #3b2416; --orange-ink: #f5c09a;
  --good: #69b98a; --good-bg: #1d3326; --good-ink: #a9dcbc;
  --info: #79a8d4; --info-bg: #1b2a38; --info-ink: #b8d3ec;
  --purple: #a990d8; --purple-bg: #2b2340; --purple-ink: #d6c8f1;
  --slate: #98a39d; --slate-bg: #262d2a; --slate-ink: #cdd5d0;
  --focus: #79a8d4;
  --shadow: 0 1px 2px rgba(0,0,0,.35);
  --shadow-pop: 0 14px 36px rgba(0,0,0,.55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font: 14px/1.45 var(--font); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 8px; }
.wrap-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 720px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: 236px 1fr; min-height: 100vh; }
.side { background: var(--side); color: var(--side-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 16px 12px 24px; display: flex; flex-direction: column; gap: 4px; z-index: 30; }
.side-brand { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 6px 14px; border-bottom: 1px solid rgba(255,255,255,.08); margin-bottom: 8px; }
.side-brand img { max-width: 150px; max-height: 110px; border-radius: 8px; }
.side-brand .t { font-family: var(--display); font-size: 15px; text-align: center; color: var(--side-ink); }
.side-sec { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--side-muted); margin: 12px 10px 4px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; color: var(--side-ink); padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 13.5px; }
.nav:hover { background: rgba(255,255,255,.06); }
.nav.active { background: var(--side-active); font-weight: 600; }
.nav .ic { width: 18px; text-align: center; opacity: .85; }
.nav .badge { margin-left: auto; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 18px; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.12); color: inherit; }
.badge.red { background: var(--danger); color: #fff; }
.badge.amber { background: var(--warning); color: #fff; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--border); padding: 10px 22px; display: flex; align-items: center; gap: 10px; }
.top h1 { font-family: var(--display); font-weight: 500; font-size: 22px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu-btn { display: none; }
.content { padding: 18px 22px 60px; max-width: 1500px; width: 100%; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.sync.saving .dot { background: var(--warning); }
.sync.error .dot { background: var(--danger); }
.sync.error { color: var(--danger); }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 250px; transform: translateX(-100%); transition: transform .2s; }
  .side.open { transform: none; box-shadow: var(--shadow-pop); }
  .menu-btn { display: inline-flex; }
  .top { padding: 10px 12px; }
  .content { padding: 14px 12px 60px; }
  .top .hide-sm { display: none; }
  .top h1 { font-size: 18px; min-width: 0; flex: 1; }
  .top .spacer { display: none; }
  .col { width: 86vw; min-width: 86vw; }
  .qn-btn { right: 10px; bottom: 10px; }
}

/* ---------- Buttons & fields ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--danger); border-color: var(--danger-bg); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
.btn.icon { padding: 5px 8px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
.field > label, .lbl { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
input[type=text], input[type=number], input[type=date], input[type=password], input[type=search], input[type=email], input[type=month], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--card); color: var(--ink); min-width: 0;
}
textarea { min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.field.err > label { color: var(--danger); }
.field.err input, .field.err select { border-color: var(--danger); }
.field .err-msg { color: var(--danger); font-size: 12px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

/* ---------- Panels ---------- */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
.panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 650; }
.panel + .panel { margin-top: 14px; }
.panel-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.panel-head h3 { margin: 0; }
.panel-head select { width: auto; max-width: 220px; padding: 6px 8px; }
.empty { padding: 26px 10px; text-align: center; color: var(--faint); font-size: 13px; }
.intro { color: var(--muted); font-size: 13px; margin: 0 0 14px; max-width: 820px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); text-align: left; cursor: default; }
button.tile { cursor: pointer; }
button.tile:hover { border-color: var(--border-strong); }
.tile .n { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tile.red .n { color: var(--danger); }
.tile.amber .n { color: var(--warning); }
.tile.green .n { color: var(--good); }
.tile.purple .n { color: var(--purple); }
.tile.blue .n { color: var(--info); }
.tile.sel { outline: 2px solid var(--accent); }
.alert { background: var(--danger-bg); color: var(--danger-ink); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.alert.info { background: var(--info-bg); color: var(--info-ink); }
.alert.warn { background: var(--warning-bg); color: var(--warning-ink); }
.dash-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
@media (max-width: 1100px) { .dash-grid { grid-template-columns: 1fr; } }

/* ---------- Chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--slate-bg); color: var(--slate-ink); }
.chip.urgente, .chip.red { background: var(--danger-bg); color: var(--danger-ink); }
.chip.alta, .chip.orange { background: var(--orange-bg); color: var(--orange-ink); }
.chip.media, .chip.blue { background: var(--info-bg); color: var(--info-ink); }
.chip.baixa, .chip.gray { background: var(--slate-bg); color: var(--slate-ink); }
.chip.amber { background: var(--warning-bg); color: var(--warning-ink); }
.chip.green { background: var(--good-bg); color: var(--good-ink); }
.chip.purple { background: var(--purple-bg); color: var(--purple-ink); }
.chip.click { cursor: pointer; }

/* ---------- Toolbar / filters ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.toolbar input[type=search], .toolbar input[type=text] { width: 220px; }
.toolbar select, .toolbar input[type=date] { width: auto; max-width: 220px; padding: 6px 8px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 10px; font-size: 12.5px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }

/* ---------- Kanban ---------- */
.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
.col { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; width: 310px; min-width: 310px; display: flex; flex-direction: column; max-height: calc(100vh - 210px); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.col-head .name { font-weight: 650; font-size: 13.5px; }
.col-head .cnt { font-size: 12px; color: var(--muted); }
.col-body { padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 60px; flex: 1; }
.col-body.over { background: var(--accent-soft); border-radius: 0 0 12px 12px; }
.col-add { margin: 0 10px 10px; }
.add-col { min-width: 220px; }
.card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--slate); border-radius: 10px; padding: 10px 11px; box-shadow: var(--shadow); cursor: pointer; }
.card:hover { border-color: var(--border-strong); }
.card.p-urgente { border-left-color: var(--danger); }
.card.p-alta { border-left-color: var(--orange); }
.card.p-media { border-left-color: var(--info); }
.card.p-baixa { border-left-color: var(--slate); }
.card.done { opacity: .72; }
.card.done .card-title { text-decoration: line-through; text-decoration-color: var(--faint); }
.card.dragging { opacity: .4; }
.card-top { display: flex; gap: 6px; align-items: flex-start; }
.card-title { font-weight: 600; font-size: 13.5px; flex: 1; word-break: break-word; }
.card-desc { color: var(--muted); font-size: 12.5px; margin: 4px 0 0; white-space: pre-wrap; max-height: 3.9em; overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.kebab { border: 0; background: transparent; cursor: pointer; padding: 0 4px; font-size: 16px; line-height: 1; color: var(--muted); border-radius: 6px; }
.kebab:hover { background: var(--surface-2); }
.prog { margin-top: 8px; cursor: pointer; }
.prog-bar { height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--good); border-radius: 3px; }
.prog-lbl { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.cl-items { margin-top: 6px; display: flex; flex-direction: column; gap: 2px; }
.cl-item { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 0; flex-wrap: wrap; }
.cl-item input[type=checkbox] { accent-color: var(--accent); margin: 0; }
.cl-item .txt { flex: 1; min-width: 120px; }
.cl-item.done .txt { text-decoration: line-through; color: var(--faint); }
.tgl { border: 1px solid var(--border-strong); background: transparent; border-radius: 6px; font-size: 10.5px; font-weight: 700; padding: 0 5px; cursor: pointer; color: var(--faint); line-height: 17px; }
.tgl.on { background: var(--purple-bg); border-color: var(--purple); color: var(--purple-ink); }
.tgl.on.nf, .tgl.on.boleto { background: var(--good-bg); border-color: var(--good); color: var(--good-ink); }
.hon { font-size: 11px; background: var(--accent-soft); color: var(--accent-soft-ink); border-radius: 6px; padding: 0 6px; cursor: pointer; font-variant-numeric: tabular-nums; }
.months { display: flex; flex-wrap: wrap; gap: 3px; margin: 0 0 4px 20px; }
.mchip { font-size: 10.5px; border-radius: 5px; padding: 0 5px; border: 1px solid var(--border-strong); cursor: pointer; color: var(--faint); }
.mchip.on { background: var(--good-bg); border-color: var(--good); color: var(--good-ink); }

/* ---------- Tables ---------- */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 650; padding: 9px 10px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl.matrix td, .tbl.matrix th { text-align: center; }
.tbl.matrix td:first-child, .tbl.matrix th:first-child { text-align: left; }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10,18,14,.45); display: flex; align-items: flex-start; justify-content: center; padding: 5vh 14px; overflow-y: auto; z-index: 60; }
.overlay.task { z-index: 70; }
.overlay.confirm { z-index: 80; }
.overlay.top { z-index: 90; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px; box-shadow: var(--shadow-pop); display: flex; flex-direction: column; }
.modal.wide { max-width: 760px; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.modal-head h2 { margin: 0; font-size: 17px; font-weight: 650; flex: 1; }
.modal-body { padding: 16px 18px; }
.modal-foot { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; padding: 0 18px; border-bottom: 1px solid var(--border); }
.tabs button { border: 0; background: transparent; padding: 10px 12px; cursor: pointer; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.pri-pick { display: flex; gap: 6px; flex-wrap: wrap; }
.pri-pick button { border: 1px solid var(--border-strong); background: var(--card); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 12.5px; }
.pri-pick button.on.urgente { background: var(--danger-bg); border-color: var(--danger); color: var(--danger-ink); }
.pri-pick button.on.alta { background: var(--orange-bg); border-color: var(--orange); color: var(--orange-ink); }
.pri-pick button.on.media { background: var(--info-bg); border-color: var(--info); color: var(--info-ink); }
.pri-pick button.on.baixa { background: var(--slate-bg); border-color: var(--slate); color: var(--slate-ink); }
.cl-edit { display: flex; flex-direction: column; gap: 3px; max-height: 360px; overflow-y: auto; }
.cl-edit .cl-item { padding: 4px 6px; border-radius: 6px; font-size: 13px; }
.cl-edit .cl-item:hover { background: var(--surface-2); }
.cl-edit .txt[contenteditable] { outline: none; }
.x { border: 0; background: transparent; color: var(--faint); cursor: pointer; font-size: 14px; padding: 0 4px; }
.x:hover { color: var(--danger); }
.client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px; max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--card); }
.comment { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; background: var(--card); }
.comment .meta { font-size: 11.5px; color: var(--faint); margin-bottom: 3px; display: flex; gap: 8px; }
.comment .body { white-space: pre-wrap; font-size: 13px; }
.hist { font-size: 12.5px; padding: 5px 0; border-bottom: 1px dashed var(--border); }
.hist span { color: var(--faint); margin-right: 6px; }

/* ---------- Popover menu ---------- */
.pop { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-pop); padding: 5px; z-index: 100; min-width: 190px; }
.pop button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.pop button:hover { background: var(--surface-2); }
.pop button.danger { color: var(--danger); }
.pop hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }

/* ---------- Toast ---------- */
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 200; box-shadow: var(--shadow-pop); max-width: 90vw; }

/* ---------- Notifications ---------- */
.bell { position: relative; }
.bell .badge { position: absolute; top: -5px; right: -6px; background: var(--danger); color: #fff; }
.notif-panel { position: fixed; top: 54px; right: 16px; width: 380px; max-width: calc(100vw - 24px); max-height: 72vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-pop); z-index: 65; }
.notif-panel .hd { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
.notif { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 8px; }
.notif:hover { background: var(--surface-2); }
.notif .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; visibility: hidden; }
.notif.unread .dot { visibility: visible; }
.notif.unread .tt { font-weight: 650; }
.notif .tx { font-size: 12.5px; color: var(--muted); }
.notif .ts { font-size: 11px; color: var(--faint); }

/* ---------- Charts ---------- */
.hbar { display: grid; grid-template-columns: 130px 1fr 40px; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12.5px; }
.hbar .track { height: 12px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.hbar .fill { height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); }
.hbar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.vbars { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 18px; border-bottom: 1px solid var(--border); }
.vbar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; }
.vbar .b { width: 70%; max-width: 46px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.vbar .v { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vlabels { display: flex; gap: 10px; margin-top: 4px; }
.vlabels div { flex: 1; text-align: center; font-size: 11.5px; color: var(--muted); }
.obl { display: grid; grid-template-columns: 1fr 120px 52px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 13px; cursor: pointer; }
.obl:last-child { border-bottom: 0; }
.obl .prog-bar { height: 8px; }
.li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--border); cursor: pointer; font-size: 13px; }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { font-size: 11px; text-transform: uppercase; color: var(--muted); text-align: center; padding: 4px 0; font-weight: 650; }
.cal .day { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; min-height: 104px; padding: 5px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.cal .day.out { opacity: .45; }
.cal .day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal .day .dn { font-size: 12px; font-weight: 650; color: var(--muted); }
.cal .ev { font-size: 11px; padding: 1px 5px; border-radius: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid; }
.ev.st-open { background: var(--info-bg); color: var(--info-ink); border-color: var(--info); }
.ev.st-late { background: var(--danger-bg); color: var(--danger-ink); border-color: var(--danger); }
.ev.st-soon { background: var(--orange-bg); color: var(--orange-ink); border-color: var(--orange); }
.ev.st-done { background: var(--good-bg); color: var(--good-ink); border-color: var(--good); }
.ev.st-wait { background: var(--purple-bg); color: var(--purple-ink); border-color: var(--purple); }
.ev.st-cert { background: var(--warning-bg); color: var(--warning-ink); border-color: var(--warning); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
@media (max-width: 720px) { .cal .day { min-height: 64px; } .cal .ev { font-size: 9.5px; } }

/* ---------- Vault ---------- */
.vault-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; box-shadow: var(--shadow); }
.vault-card .vh { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.vault-card .vh b { font-size: 14px; flex: 1; }
.vrow { padding: 9px 14px; border-bottom: 1px dashed var(--border); }
.vrow:last-child { border-bottom: 0; }
.vrow .main-line { display: grid; grid-template-columns: minmax(160px, 1.2fr) 1fr 1fr auto; gap: 10px; align-items: center; }
@media (max-width: 800px) { .vrow .main-line { grid-template-columns: 1fr; } }
.secret { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border-radius: 6px; padding: 2px 6px; max-width: 100%; overflow: hidden; }
.secret span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lock-box { max-width: 440px; margin: 6vh auto; }

/* ---------- Gate screens ---------- */
.gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.gate .box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-pop); padding: 26px; width: 100%; max-width: 500px; }
.gate h2 { font-family: var(--display); font-weight: 500; margin: 0 0 8px; }
.gate img { max-width: 120px; display: block; margin: 0 auto 14px; border-radius: 10px; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Quick notes ---------- */
.qn-btn { position: fixed; right: 18px; bottom: 18px; z-index: 40; border-radius: 999px; box-shadow: var(--shadow-pop); padding: 10px 16px; }
.qn-panel { position: fixed; right: 18px; bottom: 66px; width: 320px; max-width: calc(100vw - 36px); max-height: 60vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-pop); z-index: 41; }
.qn-panel .hd { padding: 10px 12px; border-bottom: 1px solid var(--border); font-weight: 650; display: flex; }
.qn-list { overflow-y: auto; padding: 6px 10px; flex: 1; }
.qn-item { display: flex; gap: 6px; align-items: flex-start; padding: 4px 0; font-size: 13px; }
.qn-item.done span { text-decoration: line-through; color: var(--faint); }
.qn-item span { flex: 1; white-space: pre-wrap; word-break: break-word; }

@media print { .side, .top, .qn-btn { display: none !important; } .app { display: block; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.dash-grid > div, .grid2 > div { min-width: 0; }
@media (max-width: 720px) { .obl { grid-template-columns: 1fr 60px 40px; } .hbar { grid-template-columns: 90px 1fr 40px; } .vrow .main-line { gap: 6px; } }

</style>

<script>
/* =====================================================================
   PAINEL R3 SOLUÇÕES CONTÁBEIS
   Código-fonte legível. Os dados ficam em um repositório PRIVADO do GitHub
   (dados.json e cofre.json). Nenhuma chave ou senha fica neste arquivo.

"use strict";

/* ---------------- Utilidades ---------------- */
var APP_VERSION = "1.0.0";
var LS = {
  token: "r3p-github-token", repo: "r3p-github-repo", branch: "r3p-github-branch",
  theme: "r3p-theme", view: "r3p-view", prefs: "r3p-prefs"
};
function lsGet(k, def) { try { var v = localStorage.getItem(k); return v === null ? def : v; } catch (e) { return def; } }
function lsSet(k, v) { try { if (v === null || v === undefined) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }

function uid(p) { return (p || "") + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function pad2(n) { return String(n).padStart(2, "0"); }
function ymd(y, m0, d) { return y + "-" + pad2(m0 + 1) + "-" + pad2(d); }
function dateToStr(d) { return ymd(d.getFullYear(), d.getMonth(), d.getDate()); }
function todayStr() { return dateToStr(new Date()); }
function monthKey(d) { d = d || new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1); }
function parseD(s) { return s ? new Date(s + "T12:00:00") : null; }
function addDaysStr(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return dateToStr(d); }
function daysUntil(s) { if (!s) return null; return Math.round((parseD(s) - parseD(todayStr())) / 86400000); }
function daysInMonth(y, m0) { return new Date(y, m0 + 1, 0).getDate(); }
function fmtDate(s) { if (!s) return ""; var p = s.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function fmtDateShort(s) { if (!s) return ""; var p = s.split("-"); return p[2] + "/" + p[1]; }
function fmtTs(ts) { if (!ts) return ""; var d = new Date(ts); return dateToStr(d).split("-").reverse().join("/") + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
var MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
var MESES_AB = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
function fmtMonthKey(k) { if (!k) return ""; var p = k.split("-"); return MESES_AB[+p[1] - 1] + "/" + p[0]; }
function money(n) { return (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function norm(s) { return (s || "").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function byName(a, b) { return (a.name || "").localeCompare(b.name || "", "pt-BR"); }
function onlyDigits(s) { return (s || "").replace(/\D/g, ""); }
function maskCpfCnpj(v) {
  var d = onlyDigits(v).slice(0, 14);
  if (d.length <= 11) return d.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  return d.replace(/^(\d{2})(\d)/, "$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d)/, ".$1/$2").replace(/(\d{4})(\d)/, "$1-$2");
}

/* Criação de elementos: h("div", {class:"x", onclick: fn}, "texto", outroNo) */
function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
      var v = attrs[k];
      if (v === null || v === undefined || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") el.style.cssText = v;
      else if (k === "html") el.innerHTML = v;
      else if (k === "value") el.value = v;
      else if (k === "checked") el.checked = !!v;
      else if (k.slice(0, 2) === "on" && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, v);
    }
  }
  for (var i = 2; i < arguments.length; i++) append(el, arguments[i]);
  return el;
}
function append(el, c) {
  if (c === null || c === undefined || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { append(el, x); }); return; }
  el.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
function debounce(fn, ms) { var t; return function () { var a = arguments, s = this; clearTimeout(t); t = setTimeout(function () { fn.apply(s, a); }, ms); }; }

function b64ToBytes(b64) { var bin = atob(b64.replace(/\s/g, "")); var u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function bytesToB64(bytes) { var bin = ""; for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function b64ToText(b64) { return new TextDecoder().decode(b64ToBytes(b64)); }
function textToB64(t) { return bytesToB64(new TextEncoder().encode(t)); }

function downloadText(filename, text, mime) {
  var blob = new Blob([text], { type: mime || "application/json" });
  var a = h("a", { href: URL.createObjectURL(blob), download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
}
function csvCell(v) { v = v === null || v === undefined ? "" : String(v); return /[";\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadCsv(filename, rows) {
  var text = "﻿" + rows.map(function (r) { return r.map(csvCell).join(";"); }).join("\r\n");
  downloadText(filename, text, "text/csv;charset=utf-8");
}

/* ---------------- Camada GitHub (Contents API) ---------------- */
function GhError(status, message) { var e = new Error(message || ("HTTP " + status)); e.status = status; return e; }

var GH = {
  token: null, repo: null, branch: "main",
  api: "https://api.github.com",
  headers: function (extra) {
    var hd = { "Authorization": "Bearer " + this.token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
    for (var k in extra || {}) hd[k] = extra[k];
    return hd;
  },
  url: function (path) { return this.api + "/repos/" + this.repo + "/contents/" + path.split("/").map(encodeURIComponent).join("/"); },
  call: async function (url, opts) {
    var res;
    try { res = await fetch(url, opts); }
    catch (e) { throw GhError(0, "Sem conexão com o GitHub."); }
    return res;
  },
  fail: async function (res) {
    var msg = "";
    try { var j = await res.json(); msg = j.message || ""; } catch (e) {}
    if (res.status === 401) msg = "Token inválido ou expirado.";
    if (res.status === 403 && /rate limit/i.test(msg)) msg = "Limite de uso da API do GitHub atingido. Aguarde alguns minutos.";
    throw GhError(res.status, msg || ("Erro " + res.status + " do GitHub."));
  },
  /* Lê um arquivo. Com etag, pode devolver {notModified:true} (304 não conta no limite). */
  getFile: async function (path, etag) {
    var hd = this.headers(etag ? { "If-None-Match": etag } : null);
    var res = await this.call(this.url(path) + "?ref=" + encodeURIComponent(this.branch) + "&t=" + (etag ? "" : Date.now()), { headers: hd, cache: "no-store" });
    if (res.status === 304) return { notModified: true };
    if (!res.ok) await this.fail(res);
    var j = await res.json();
    var text;
    if (j.content && j.encoding === "base64") text = b64ToText(j.content);
    else if (j.sha) {
      /* Arquivos acima de 1 MB: a Contents API não traz o conteúdo; busca pelo blob. */
      var r2 = await this.call(this.api + "/repos/" + this.repo + "/git/blobs/" + j.sha, { headers: this.headers(), cache: "no-store" });
      if (!r2.ok) await this.fail(r2);
      var j2 = await r2.json();
      text = b64ToText(j2.content || "");
    } else text = "";
    return { text: text, sha: j.sha, etag: res.headers.get("ETag") };
  },
  putFile: async function (path, text, sha, message) {
    var body = { message: message || ("Atualiza " + path), content: textToB64(text), branch: this.branch };
    if (sha) body.sha = sha;
    var res = await this.call(this.url(path), { method: "PUT", headers: this.headers({ "Content-Type": "application/json" }), body: JSON.stringify(body) });
    if (!res.ok) await this.fail(res);
    var j = await res.json();
    return { sha: j.content && j.content.sha };
  },
  deleteFile: async function (path, sha, message) {
    var res = await this.call(this.url(path), { method: "DELETE", headers: this.headers({ "Content-Type": "application/json" }), body: JSON.stringify({ message: message || ("Remove " + path), sha: sha, branch: this.branch }) });
    if (!res.ok) await this.fail(res);
  },
  listDir: async function (path) {
    var res = await this.call(this.url(path) + "?ref=" + encodeURIComponent(this.branch) + "&t=" + Date.now(), { headers: this.headers(), cache: "no-store" });
    if (res.status === 404) return [];
    if (!res.ok) await this.fail(res);
    var j = await res.json();
    return Array.isArray(j) ? j : [];
  }
};

/* ---------------- Canal de sincronização ----------------
   Documento único por arquivo. Cada alteração é uma função op(doc) guardada
   numa fila. Ao salvar, as ops são aplicadas sobre a última versão do GitHub
   e gravadas com o sha. Em conflito (409/422), relê a versão mais nova,
   reaplica as ops e tenta de novo (até 3 vezes). Ninguém sobrescreve ninguém.
   Regra de ouro: ops encontram objetos pelo id, nunca guardam referências. */
function Channel(path, opts) {
  this.path = path;
  this.encode = opts.encode || function (o) { return JSON.stringify(o, null, 1); };
  this.decode = opts.decode || function (t) { return JSON.parse(t); };
  this.onChange = opts.onChange || function () {};
  this.onStatus = opts.onStatus || function () {};
  this.label = opts.label || path;
  this.remote = null; this.local = null; this.sha = null; this.etag = null;
  this.pending = []; this.saving = false; this.timer = null; this.status = "ok"; this.lastError = null;
}
Channel.prototype.setStatus = function (s, err) { this.status = s; this.lastError = err || null; this.onStatus(s, err); };
Channel.prototype.rebuildLocal = function () {
  var l = clone(this.remote);
  this.pending.forEach(function (op) { try { op(l); } catch (e) { console.error("op", e); } });
  this.local = l;
};
Channel.prototype.load = async function () {
  var r = await GH.getFile(this.path, null);
  this.remote = await this.decode(r.text);
  this.sha = r.sha; this.etag = r.etag;
  this.rebuildLocal();
};
Channel.prototype.mutate = function (op, quiet) {
  try { op(this.local); } catch (e) { console.error("op", e); }
  this.pending.push(op);
  this.setStatus("dirty");
  this.schedule(900);
  if (!quiet) this.onChange("local");
};
Channel.prototype.schedule = function (ms) {
  var self = this;
  clearTimeout(this.timer);
  this.timer = setTimeout(function () { self.flush(); }, ms);
};
Channel.prototype.flush = async function () {
  if (this.saving || !this.pending.length) return;
  this.saving = true;
  this.setStatus("saving");
  var ops = this.pending.slice();
  var ok = false;
  for (var attempt = 0; attempt < 4; attempt++) {
    var base = clone(this.remote);
    ops.forEach(function (op) { try { op(base); } catch (e) { console.error("op", e); } });
    try {
      var text = await this.encode(base);
      var r = await GH.putFile(this.path, text, this.sha, "Painel R3: " + this.label + " (" + ops.length + " alteração(ões))");
      this.sha = r.sha; this.etag = null; this.remote = base;
      this.pending = this.pending.slice(ops.length);
      this.rebuildLocal();
      ok = true;
      break;
    } catch (e) {
      if ((e.status === 409 || e.status === 422) && attempt < 3) {
        try { await this.load(); this.onChange("remote"); } catch (e2) { this.lastError = e2; break; }
        continue;
      }
      this.lastError = e;
      break;
    }
  }
  this.saving = false;

  maybeMutate(function (d) { autoArchive(d); });
  var archived = countArch() - before;

  if (generated.length) {

    generated.sort(function (a, b) { var ra = order.indexOf(a[0]), rb = order.indexOf(b[0]); return (ra < 0 ? 99 : ra) - (rb < 0 ? 99 : rb); });
    M(function (d) { generated.forEach(function (g) { var tm = findById(d.recorrencias, g[0]); if (tm && duePeriodFor(tm)) generateFor(d, g[0], g[1]); }); });

      var res = await GH.putFile("cofre.json", await vEncrypt(obj, key, salt, 600000), VAULT.ch.sha, "Painel R3: troca senha do cofre");
      VAULT.ch.remote = obj; VAULT.ch.sha = res.sha; VAULT.ch.etag = null; VAULT.ch.rebuildLocal(); VAULT.fileSalt = salt;
      m.close(); toast("Senha mestra trocada."); render();
    } catch (e) { VAULT.key = oldKey; VAULT.salt = oldSalt; toast("Falha ao trocar: " + e.message); }
  } }, "Trocar")]);
}
/* Polling do cofre junto com o dos dados, só quando aberto. */
setInterval(function () { if (VAULT.ch && VAULT.state === "aberto" && document.visibilityState === "visible") VAULT.ch.poll().catch(function () {}); }, 20000);
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "hidden" && VAULT.state === "aberto") { VAULT.hiddenAt = Date.now(); }
  if (document.visibilityState === "visible" && VAULT.hiddenAt && Date.now() - VAULT.hiddenAt > VAULT_IDLE_MS && VAULT.state === "aberto") vLock("Cofre travado após 5 minutos longe da tela.");
});

boot();
</script>
